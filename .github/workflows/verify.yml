name: Verify learning journey
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LOCAL_DATABASE_PATH: .local/postgres
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: mkdir -p .local && npm run db:migrate && npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run start > .local/server.log 2>&1 &
      - run: node scripts/wait-server.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            docs/screenshots/
